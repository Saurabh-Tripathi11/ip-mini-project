<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Confirmed | ShopEase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar-amazon">
    <div class="navbar-top" style="max-width:1500px;margin:0 auto;">
        <a href="/" class="brand-logo"><span class="logo-accent">Shop</span>Ease</a>
        <div class="search-bar">
            <input type="text" placeholder="Search ShopEase...">
            <button type="button"><i class="bi bi-search"></i></button>
        </div>
        <div class="nav-actions">
            <a href="/" class="nav-btn"><span class="nav-btn-label">Hello,</span><span class="nav-btn-value">Shop Now</span></a>
            <a href="/orders" class="nav-btn"><span class="nav-btn-label">Returns</span><span class="nav-btn-value">& Orders</span></a>
            <a href="/cart" class="nav-btn nav-btn-cart">
                <span class="cart-icon"><i class="bi bi-cart3"></i></span>
                <span class="nav-btn-value">Cart</span>
            </a>
        </div>
    </div>
</nav>

<div class="main-content" style="display:flex;justify-content:center;padding-top:32px;">
    <div class="success-card">
        <div class="success-icon">
            <i class="bi bi-check-lg"></i>
        </div>
        <h2>Order Confirmed!</h2>
        <p class="success-msg">Thank you for shopping with ShopEase. Your order has been placed successfully.</p>

        <div class="order-details-box">
            <div class="detail-row">
                <span class="label">Order ID</span>
                <span class="value" th:text="'#' + ${order.id}">#1</span>
            </div>
            <div class="detail-row">
                <span class="label">Date</span>
                <span class="value" th:text="${#temporals.format(order.orderDate, 'dd MMM yyyy, hh:mm a')}">Date</span>
            </div>
            <div class="detail-row">
                <span class="label">Status</span>
                <span class="status-badge status-confirmed" th:text="${order.status}">CONFIRMED</span>
            </div>
            <hr>
            <div class="detail-row">
                <span class="label">Items</span>
                <span class="value" style="font-size:0.8rem;max-width:260px;text-align:right;"
                      th:text="${order.itemsSummary}">Items</span>
            </div>
            <hr>
            <div class="detail-row" style="font-size:1.1rem;">
                <span class="label" style="font-weight:700;">Total</span>
                <span class="value" style="color:var(--price-color);">
                    ₹<span th:text="${#numbers.formatDecimal(order.totalAmount, 1, 2)}">0.00</span>
                </span>
            </div>
        </div>

        <div style="display:flex;gap:10px;justify-content:center;">
            <a href="/orders" class="btn-shop-more"><i class="bi bi-receipt me-1"></i> View Orders</a>
            <a href="/" class="btn-back"><i class="bi bi-arrow-left me-1"></i> Continue Shopping</a>
        </div>
    </div>
</div>

<footer class="footer-amazon">ShopEase &copy; 2026 — AI-Powered Smart Shopping</footer>
</body>
</html>
